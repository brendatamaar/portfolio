# Production stack. Images are built by GitHub Actions and pulled from GHCR.
# Public traffic arrives only through the Cloudflare Tunnel (cloudflared) —
# no container publishes a host port. See docs/deployment.md.
#
# Local image build: docker compose -f docker-compose.yml -f docker-compose.build.yml up --build

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  server:
    image: ghcr.io/brendatamaar/portfolio-server:${IMAGE_TAG:-latest}
    environment:
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS}
      - UPLOADS_DIR=/app/server/uploads
    volumes:
      - ./data:/app/server/data
      - ./uploads:/app/server/uploads
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    image: ghcr.io/brendatamaar/portfolio-web:${IMAGE_TAG:-latest}
    environment:
      - PORT=3000
      - API_INTERNAL_URL=http://server:3001/api
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      start_period: 15s
      start_interval: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M

  admin:
    image: ghcr.io/brendatamaar/portfolio-admin:${IMAGE_TAG:-latest}
    environment:
      - PORT=3000
      - API_INTERNAL_URL=http://server:3001/api
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      # adapter-node needs the public origin for its CSRF check behind a proxy
      - ORIGIN=${ADMIN_ORIGIN}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/login']
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
      - admin
      - server
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
