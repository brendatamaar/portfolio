<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/images/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="%sveltekit.assets%/images/favicon/favicon-96x96.png" />
    <link rel="icon" type="image/x-icon" href="%sveltekit.assets%/images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/images/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/images/favicon/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <script>
      // Dark-first like the homepage: saved choice, else OS, else dark.
      try {
        var th = localStorage.getItem('admin_theme')
        if (th ? th === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.classList.add('dark')
      } catch (e) { document.documentElement.classList.add('dark') }
    </script>
    %sveltekit.head%
  </head>
  <body class="min-h-screen bg-page font-sans text-ink" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
