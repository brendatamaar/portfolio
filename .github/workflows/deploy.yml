name: CI & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/brendatamaar/portfolio
  # Baked into the admin client bundle (admin appends /api itself)
  PUBLIC_API_ORIGIN: https://api.brendatama.dev

jobs:
  validate:
    name: Validate - ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: server
            filter: portfolio-server...
            command: pnpm typecheck
          - project: web
            filter: portfolio-web...
            command: pnpm typecheck && pnpm build
          - project: admin
            filter: portfolio-admin-new...
            command: pnpm typecheck && pnpm build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter ${{ matrix.filter }}

      - name: Run validation
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.project }}

  build:
    name: Build image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [server, web, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=${{ env.PUBLIC_API_ORIGIN }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.VPS_USER }}/portfolio

      - name: Pull images and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG
          command_timeout: 10m
          script: |
            set -e
            cd ~/portfolio

            # Preflight: fail fast with a clear message instead of an unhealthy container
            if [ ! -r .env ]; then
              echo "::error::~/portfolio/.env is missing or unreadable (see docs/deployment.md step 7)"
              exit 1
            fi
            for dir in data uploads; do
              if [ "$(stat -c %u "$dir" 2>/dev/null)" != "1000" ]; then
                echo "::error::~/portfolio/$dir must exist and be owned by uid 1000: sudo mkdir -p ~/portfolio/$dir && sudo chown -R 1000:1000 ~/portfolio/$dir"
                exit 1
              fi
            done

            echo "Backing up database"
            docker compose exec -T server bun run server/scripts/backup-db.ts \
              || echo "Backup skipped (server not running yet)"

            echo "Pulling images ($IMAGE_TAG)"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE_TAG="$IMAGE_TAG" docker compose pull
            docker logout ghcr.io

            echo "Restarting (waits for health checks)"
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --remove-orphans --wait --wait-timeout 180

            # Record the deployed tag so manual `docker compose` runs use the same images
            sed -i '/^IMAGE_TAG=/d' .env && echo "IMAGE_TAG=$IMAGE_TAG" >> .env

            docker image prune -af --filter "until=168h"
            echo "Deploy complete"
